name: Preview

on:
  push:
    branches:
      - quick-schedule

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: fallfest-quick-schedule-preview
          path: _site/
