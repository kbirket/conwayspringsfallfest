<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conway Springs Fall Fest — Coming Soon</title>
  <style>
    /* Reset & CSS Variables */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent-orange: #f97316;
      --accent-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 1.5rem;
    }

    /* Animated Background Glowing Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      opacity: 0.5;
      animation: float 10s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 350px;
      height: 350px;
      background: var(--accent-orange);
      top: -10%;
      left: -10%;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: var(--accent-amber);
      bottom: -15%;
      right: -10%;
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.1); }
    }

    /* Main Container (Glassmorphism Effect) */
    .card {
      position: relative;
      z-index: 1;
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* Badge */
    .badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      background: rgba(249, 115, 22, 0.15);
      color: var(--accent-orange);
      border: 1px solid rgba(249, 115, 22, 0.3);
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
    }

    /* Heading with Text Gradient */
    h1 {
      font-size: 2.75rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-orange) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-muted);
      font-size: 1.125rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    /* Progress Status Indicator */
    .status-container {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 1rem 1.25rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: var(--accent-amber);
      border-radius: 50%;
      position: relative;
    }

    .pulse-dot::after {
      content: '';
      position: absolute;
      top: -3px;
      left: -3px;
      right: -3px;
      bottom: -3px;
      border-radius: 50%;
      border: 2px solid var(--accent-amber);
      animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes ping {
      75%, 100% {
        transform: scale(2);
        opacity: 0;
      }
    }

    .status-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- Background Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Content Card -->
  <main class="card">
    <div class="badge">🍂 Fall Fest Update</div>
    <h1>Something Big is Coming</h1>
    <p>We are currently updating the official website for the Conway Springs Fall Fest. Check back soon for event details, schedules, and vendor information!</p>
    
    <div class="status-container">
      <div class="pulse-dot"></div>
      <span class="status-text">Site updates in progress...</span>
    </div>
  </main>

</body>
</html>
